name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1

      - name: Install Python dependencies
        # NOTE: this list duplicates pyproject.toml's `dependencies` by hand, so
        # a new runtime import has to be added in both places or collection
        # fails here only. That is how tomlkit went missing. PyGObject comes
        # from apt above (python3-gi), which is why this is not `pip install -e
        # ".[dev]"` — pip would try to build it from source.
        run: |
          pip install --break-system-packages pytest pytest-cov pytest-mock pydantic tomli tomli-w tomlkit

      - name: Run unit tests + contract battery
        # tests/invariants/ is the enforcement mechanism (ADR-001): every Adapter
        # subclass discovered by walking nightpanel.adapters is checked against the
        # contract. bin/test runs the same two directories, so a developer and CI
        # cannot disagree about what "green" means.
        run: PYTHONPATH=src pytest tests/unit/ tests/invariants/ -v --cov=nightpanel --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  preset-validation:
    name: Validate Presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            python3-pydantic
          sudo pip3 install --break-system-packages tomli tomli-w

      - name: Validate all presets
        run: |
          PYTHONPATH=src python3 -c "
          from pathlib import Path
          from nightpanel.models.profile import Profile

          presets_dir = Path('src/nightpanel/resources/presets')
          for preset_path in presets_dir.glob('*.toml'):
              print(f'Validating {preset_path.name}...')
              profile = Profile.from_toml(preset_path)
              assert profile.name, f'{preset_path.name}: missing name'
              assert profile.shortcuts, f'{preset_path.name}: no shortcuts'
              print(f'  ✓ {len(profile.shortcuts)} shortcuts loaded')
          print('All presets valid!')
          "
